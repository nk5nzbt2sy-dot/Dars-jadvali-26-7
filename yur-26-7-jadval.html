<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yur-26-7 — dars jadvali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE4D6;
    --card:#F5F1E6;
    --navy:#1B2440;
    --navy-2:#2A3660;
    --gold:#A9812E;
    --burgundy:#7C2D2D;
    --ink:#211D16;
    --ink-soft:#6B6355;
    --line:#CDC4AE;
    --on-navy:#EFE7CE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15171C;
      --card:#1D2027;
      --navy:#232E52;
      --navy-2:#324070;
      --gold:#D2AF5B;
      --burgundy:#C97B6E;
      --ink:#EDE8DB;
      --ink-soft:#A9A08C;
      --line:#333849;
      --on-navy:#F1E9D2;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15171C;
    --card:#1D2027;
    --navy:#232E52;
    --navy-2:#324070;
    --gold:#D2AF5B;
    --burgundy:#C97B6E;
    --ink:#EDE8DB;
    --ink-soft:#A9A08C;
    --line:#333849;
    --on-navy:#F1E9D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 18px 40px;
  }
  .tag{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 4px;
  }
  h1{
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:2rem;
    line-height:1.1;
    margin:0 0 2px;
  }
  .date{
    font-size:0.92rem;
    color:var(--ink-soft);
    margin:0 0 20px;
  }

  .hero{
    background:var(--navy);
    color:var(--on-navy);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:18px 18px 20px;
    margin-bottom:22px;
  }
  .hero .status-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.82rem;
    color:var(--gold);
    margin-bottom:8px;
  }
  .dot-live{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .dot-live{ animation:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }
  .hero .subject{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    font-size:1.28rem;
    line-height:1.25;
    margin:0 0 8px;
  }
  .hero .meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:0.9rem;
    color:var(--on-navy);
    opacity:0.85;
  }
  .hero .meta .time{
    font-variant-numeric:tabular-nums;
  }
  .hero .plain{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:500;
    font-size:1.15rem;
    line-height:1.35;
    margin:0;
  }

  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:22px;
  }
  .tab{
    flex:1;
    padding:9px 2px;
    text-align:center;
    background:transparent;
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.82rem;
    font-weight:500;
    cursor:pointer;
    position:relative;
    transition:background-color 150ms ease, color 150ms ease;
  }
  .tab.today::after{
    content:"";
    position:absolute;
    bottom:4px; left:50%;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--gold);
    transform:translateX(-50%);
  }
  .tab.selected{
    background:var(--navy);
    color:var(--on-navy);
    border-color:var(--navy);
  }
  .tab.selected.today::after{ background:var(--gold); }
  .tab:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .day-heading{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 14px;
  }

  .timeline{
    list-style:none;
    margin:0;
    padding-left:20px;
    border-left:2px solid var(--line);
  }
  .item{
    position:relative;
    padding-bottom:24px;
  }
  .item:last-child{ padding-bottom:0; }
  .item::before{
    content:"";
    position:absolute;
    left:-26px; top:4px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--gold);
    border:2px solid var(--paper);
  }
  .item.empty::before{ background:var(--line); }
  .item.now::before{
    width:14px; height:14px;
    left:-28px; top:2px;
    background:var(--burgundy);
  }
  .item .time{
    font-variant-numeric:tabular-nums;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .item .subject{
    font-size:1.02rem;
    font-weight:500;
    line-height:1.3;
    margin-bottom:6px;
  }
  .item .subject.muted{
    color:var(--ink-soft);
    font-weight:400;
    font-style:italic;
  }
  .pill{
    display:inline-block;
    font-size:0.72rem;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:1px 8px;
    margin-left:8px;
    vertical-align:middle;
  }
  .item .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.88rem;
    color:var(--ink-soft);
  }
  .badge{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 8px;
    font-size:0.8rem;
    color:var(--ink);
    white-space:nowrap;
  }

  .selfstudy-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    font-size:0.98rem;
    color:var(--ink-soft);
  }
  .selfstudy-card b{ color:var(--ink); font-weight:500; }

  footer{
    margin-top:30px;
    font-size:0.78rem;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="tag">Yur-26-7-guruh</p>
  <h1 id="todayName">—</h1>
  <p class="date" id="todayDate">—</p>

  <div class="hero" id="hero"></div>

  <div class="tabs" id="tabs"></div>

  <h2 class="day-heading" id="dayHeading"></h2>
  <div id="dayBody"></div>

  <footer>1-kurs kunduzgi &middot; 1-semestr</footer>
</div>

<script>
const DAYS = ["Dush","Sesh","Chor","Pay","Jum","Shan"];
const DAY_FULL = {Dush:"Dushanba",Sesh:"Seshanba",Chor:"Chorshanba",Pay:"Payshanba",Jum:"Juma",Shan:"Shanba"};
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];

const schedule = {
  Dush:[
    {start:"08:30",end:"09:50",subject:"Davlat tilida ish yuritish (Akademik yozuv)",teacher:"Jomonov R.",room:"404-xona"},
    {start:"10:00",end:"11:20",subject:"Huquqiy axborot texnologiyalari",teacher:"Saydullayev S.",room:"105-xona"},
    {start:"11:30",end:"12:50",subject:"Professional ko'nikmalar va rivojlanish",teacher:"Batirov G'.",room:"404-xona"}
  ],
  Sesh:[
    {start:"08:30",end:"09:50",subject:"Dinshunoslik",note:"ma'ruza",teacher:"Madumarova Sh.",room:"410-xona"},
    {start:"10:00",end:"11:20",subject:"Davlat va huquq nazariyasi",teacher:"Farxutdinova M.",room:"404-xona"},
    {start:"11:30",end:"12:50",subject:"O'zbekistonning eng yangi tarixi",teacher:"Ro'ziyeva L.",room:"404-xona"}
  ],
  Chor:[
    {start:"08:30",end:"09:50",subject:"Konstitutsiyaviy huquq",teacher:"Ermanov G'.",room:"404-xona"},
    {start:"10:00",end:"11:20",subject:"Professional ko'nikmalar va rivojlanish",note:"ma'ruza",teacher:"Batirov G'.",room:"411-xona"},
    null
  ],
  Pay:[
    {start:"08:30",end:"09:50",subject:"Yuristlar uchun xorijiy til",teacher:"Urazbekova B.",room:"404-xona"},
    {start:"10:00",end:"11:20",subject:"Davlat va huquq nazariyasi",note:"ma'ruza",teacher:"Muhammedova N.",room:"411-xona"},
    null
  ],
  Jum:[
    {start:"08:30",end:"09:50",subject:"Konstitutsiyaviy huquq",note:"ma'ruza",teacher:"Nazarov E.",room:"411-xona"},
    {start:"10:00",end:"11:20",subject:"O'zbekistonning eng yangi tarixi",note:"ma'ruza",teacher:"Ro'ziyeva L.",room:"411-xona"},
    {start:"11:30",end:"12:50",subject:"Dinshunoslik",teacher:"Madumarova Sh.",room:"404-xona"}
  ]
};

function parseTime(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function fmtMins(mins){
  return mins + " daqiqa";
}
function jsDayToKey(jsDay){
  return {1:'Dush',2:'Sesh',3:'Chor',4:'Pay',5:'Jum',6:'Shan',0:null}[jsDay];
}

let selectedDay = jsDayToKey(new Date().getDay()) || 'Dush';

function computeStatus(){
  const now = new Date();
  const jsDay = now.getDay();
  const minutesNow = now.getHours()*60+now.getMinutes();

  if(jsDay===0){
    return {type:'off'};
  }
  const key = jsDayToKey(jsDay);
  if(key==='Shan'){
    return {type:'selfstudy'};
  }
  const classes = schedule[key].filter(Boolean);
  for(const c of classes){
    const s=parseTime(c.start), e=parseTime(c.end);
    if(minutesNow>=s && minutesNow<e){
      return {type:'now', cls:c, minsLeft:e-minutesNow};
    }
  }
  const next = classes.find(c=>parseTime(c.start)>minutesNow);
  if(next){
    return {type:'next', cls:next, minsUntil:parseTime(next.start)-minutesNow};
  }
  return {type:'done'};
}

function renderHero(){
  const hero = document.getElementById('hero');
  const st = computeStatus();
  let html = "";
  if(st.type==='off'){
    html = `<p class="hero plain">Bugun — Yakshanba. Darslar yo'q, dam olish kuni.</p>`;
  } else if(st.type==='selfstudy'){
    html = `<p class="hero plain">Bugun — Shanba. Kun bo'yi mustaqil ta'lim.</p>`;
  } else if(st.type==='now'){
    html = `
      <div class="status-label"><span class="dot-live"></span>hozirgi dars</div>
      <p class="subject">${st.cls.subject}${st.cls.note?`<span class="pill">${st.cls.note}</span>`:""}</p>
      <div class="meta"><span>${st.cls.teacher} · ${st.cls.room}</span><span class="time">tugashiga ${fmtMins(st.minsLeft)}</span></div>
    `;
  } else if(st.type==='next'){
    html = `
      <div class="status-label">keyingi dars</div>
      <p class="subject">${st.cls.subject}${st.cls.note?`<span class="pill">${st.cls.note}</span>`:""}</p>
      <div class="meta"><span>${st.cls.teacher} · ${st.cls.room}</span><span class="time">${st.cls.start} da &middot; ${fmtMins(st.minsUntil)}dan so'ng</span></div>
    `;
  } else {
    html = `<p class="hero plain">Bugungi darslar tugadi.</p>`;
  }
  hero.innerHTML = html;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const todayKey = jsDayToKey(new Date().getDay());
  tabs.innerHTML = "";
  DAYS.forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (key===selectedDay?' selected':'') + (key===todayKey?' today':'');
    btn.textContent = key;
    btn.addEventListener('click', ()=>{ selectedDay = key; renderAll(); });
    tabs.appendChild(btn);
  });
}

function renderDay(){
  document.getElementById('dayHeading').textContent = DAY_FULL[selectedDay];
  const body = document.getElementById('dayBody');
  const todayKey = jsDayToKey(new Date().getDay());
  const now = new Date();
  const minutesNow = now.getHours()*60+now.getMinutes();

  if(selectedDay==='Shan'){
    body.innerHTML = `<div class="selfstudy-card">Bu kuni darslar jadvalda belgilanmagan — barcha <b>3 juftlik</b> mustaqil ta'limga ajratilgan.</div>`;
    return;
  }

  const classes = schedule[selectedDay];
  const ul = document.createElement('ul');
  ul.className = 'timeline';

  classes.forEach(c=>{
    const li = document.createElement('li');
    if(!c){
      li.className = 'item empty';
      li.innerHTML = `<p class="subject muted">dars yo'q</p>`;
      ul.appendChild(li);
      return;
    }
    const isNow = selectedDay===todayKey && minutesNow>=parseTime(c.start) && minutesNow<parseTime(c.end);
    li.className = 'item' + (isNow?' now':'');
    li.innerHTML = `
      <div class="time">${c.start}–${c.end}</div>
      <p class="subject">${c.subject}${c.note?`<span class="pill">${c.note}</span>`:""}</p>
      <div class="row"><span>${c.teacher}</span><span class="badge">${c.room}</span></div>
    `;
    ul.appendChild(li);
  });

  body.innerHTML = "";
  body.appendChild(ul);
}

function renderHeader(){
  const now = new Date();
  const todayKey = jsDayToKey(now.getDay());
  document.getElementById('todayName').textContent = todayKey ? DAY_FULL[todayKey] : "Yakshanba";
  document.getElementById('todayDate').textContent = `${now.getDate()}-${MONTHS[now.getMonth()]}`;
}

function renderAll(){
  renderHeader();
  renderHero();
  renderTabs();
  renderDay();
}

renderAll();
setInterval(renderAll, 30000);
</script>
</body>
</html>
